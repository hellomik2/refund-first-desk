# Render blueprint for the hosted demo.
# Secrets are not in this file: after the first deploy, open the service's Environment page,
# choose "Add from .env" and paste PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, DEMO_VAULT_ID,
# DEMO_CUSTOMER_ID, STORE_PAYPAL_EMAIL and ANTHROPIC_API_KEY. The return address for PayPal comes
# from RENDER_EXTERNAL_URL, which Render sets.
services:
  - type: web
    name: refund-first-desk
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: AI_REUSE_RECORDED # prepared cases replay the recorded live answers; an edited sentence calls the AI live
        value: "1"
      - key: AI_DAILY_CALL_CAP
        value: "40"
